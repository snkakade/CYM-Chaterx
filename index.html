<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Opening CharterX…</title>
    <style>
      :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050b12;color:#f7f2ea}
      *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(circle at 80% 15%,#123044 0,transparent 38%),#050b12}
      main{width:min(100%,36rem);padding:2.5rem;border:1px solid rgba(215,183,122,.3);background:rgba(7,17,29,.9)}
      small{color:#d7b77a;letter-spacing:.12em;text-transform:uppercase}h1{margin:1rem 0 .75rem;font-family:Georgia,serif;font-size:clamp(2.4rem,8vw,4.5rem);font-weight:500;line-height:1}p{color:#aeb9c2;line-height:1.7}
      a{display:inline-flex;margin-top:1rem;padding:.85rem 1.2rem;border-radius:999px;background:#e8a56a;color:#050b12;font-weight:700;text-decoration:none}
    </style>
  </head>
  <body>
    <main>
      <small>CharterX local preview</small>
      <h1>Opening the website…</h1>
      <p id="status">Waiting for the CharterX application on port 3000.</p>
      <a href="http://localhost:3000/">Open CharterX</a>
    </main>
    <script>
      const destination = "http://localhost:3000/";
      const status = document.querySelector("#status");
      const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

      async function openCharterX() {
        for (let attempt = 0; attempt < 30; attempt += 1) {
          try {
            await fetch(destination, { mode: "no-cors", cache: "no-store" });
            window.location.replace(destination);
            return;
          } catch {
            await wait(500);
          }
        }

        status.textContent = "The application has not started. In VS Code, run the task ‘CharterX: Start Website’, then use the button below.";
      }

      openCharterX();
    </script>
  </body>
</html>
